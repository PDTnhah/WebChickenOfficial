<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đơn hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        table {
            width: 100%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .filter-container {
            margin: 20px auto;
            text-align: center;
        }

        .filter-container input,
        .filter-container select,
        .filter-container button {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .filter-container button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="filter-container">
    <input type="text" placeholder="Mã đơn hàng, Tên khách hàng, Số điện thoại">
    <select>
        <option value="new">Đơn mới</option>
        <option value="processing">Đang xử lý</option>
        <option value="ready">Đơn sẵn sàng giao</option>
        <option value="completed">Đơn đã hoàn thành</option>
        <option value="cancelled">Đơn đã hủy</option>
    </select>
    <button>Tìm kiếm</button>
</div>

<table>
    <thead>
    <tr>
        <th>idUser</th>
        <th>maOrder</th>
        <th>nameCustomer</th>
        <th>sumMoney</th>
        <th>time</th>
        <th>deliveryAddress</th>
        <th>paymentMethod</th>
        <th>products</th>
        <th>status</th>
    </tr>
    </thead>
    <tbody>
    <!-- Dữ liệu được lặp từ backend -->
    <tr th:each="order, iterStat : ${orders}">
        <td th:text="${order.idUser}">1</td>
        <td th:text="${order.maOrder}">cb_vod3966170122</td>
        <td th:text="${order.nameCustomer}">Lê Hồng</td>
        <td th:text="${#numbers.formatDecimal(order.sumMoney, 0, 'POINT')} + ' đ'">699.000 đ</td>
        <td th:text="${#dates.format(order.time, 'HH:mm dd/MM/yyyy')}">10:43 17/01/2022</td>
        <td th:text="${order.deliveryAddress}">Hà Nội</td>
        <td th:text="${order.paymentMethod}">COD</td>
        <td th:text="${order.products}">Gà rán</td>
        <td>
            <select>
                <option value="preparing" th:selected="${order.status == 'preparing'}">Đang chuẩn bị</option>
                <option value="shipped" th:selected="${order.status == 'shipped'}">Đã giao cho ship</option>
            </select>
        </td>
    </tr>
    </tbody>
</table>
</body>

</html>
