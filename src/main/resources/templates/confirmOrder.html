<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kong Fuong Chicken</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2" rel="stylesheet">
    <!-- <link rel ="stylesheet" href="style.css"> -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
          rel="stylesheet">
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    height: 100vh;
    background: #f8f9f0;
    font-family: "Poppins";
}

.Bar{
    width: 1515px;
    height: 30px;
    background: #E4002B;
}
.Post{

    width: 270px;
    height: 720px;
    background: #022135;

}
.Shopping_Cart{
    font-size: 28px;
    position:absolute;
    right: 70px;
    top: 5px;
    color: white;
}

.User_Icon{
    font-size: 28px;
    position:absolute;
    right: 10px;
    top: 5px;
    color: white;
}
.Navigation {
    color: white;
    text-align: left;
    font-size: 15px;
    padding: 20px;
    position:absolute;
    top : 150px;
}

.Navigation h2{
    margin-top: 50px;
}
.Navigation a{
    text-decoration: none;
    color: white;
}
.Navigation a:hover{
    background-color: #f8f9f0;
    color:#E4002B;
    border-radius: 10px;
    padding: 20px;
}
.Circle {
	width: 110px;
	height: 100px;
	background: #E4002B;
	-moz-border-radius: 50px;
	-webkit-border-radius: 50px;
	border-radius: 50px;
    position:absolute;
    left: 85px;
    top:0px;
}
.Kong_Fuong_Chicken img{
    width: 90px;
    height: 90px;
    position: absolute;
    left: 10px;
}
.Shopping_Cart, .User_Icon{
    cursor: pointer;
    background: unset;
    border: unset;
}
.Status {
    display: flex;
    align-items: center;
    gap: 30px;
    position: relative;
    left: 300px;
    bottom: 500px;
}

/* Cấu hình khối từng bước */
.step {
    text-align: center;
    max-width: 120px;
}

/* Đặt kích thước và căn chỉnh icon */
.step img {
    width: 50px;
    height: auto;
    margin-bottom: 10px;
}
/* Thiết kế thời gian */
.time {
    font-size: 14px;
    color: #333;
}

.Title_Box{
    position:relative;
    top: 50px;
    height: 100px;
    width: 500px;
    margin: 0px auto;
    background: #E4002B;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
}
.Title_Box a{
    position: relative;
    top: 30px;
    color:#f8f9f0

}
.Confirm{
    height: 50px;
    width: 150px;
    text-align: center;
    font-size: 25px;
    border-radius: 25px;
    background: #E4002B;
    position:absolute;
    top:650px;
    right:0px;
}
.Confirm a{
    position: relative;
    top: 10px;
    color: #f8f9f0;
}
input{
    height: 50px;
    min-width: 300px;
    background: #E4002B;
    color: white;
    font-size:16px;
}
input::placeholder {
    color: white;
    opacity: 1;
}
h1{
    position:absolute;
    left:50px;
}
.Name{
    height: 50px;
    width: 600px;
    position: relative;
    top:50px;
    display:block;
    margin: 25px 100px;
}
.Name input{
    height: 50px;
    width: 600px;
    position: relative;
}
.Phone_Number{
    height: 50px;
    width: 600px;
    position: relative;
    top:50px;
    left: 700px;
    display:block;
    margin: 25px 100px;
}
.Phone_Number input{
    height: 50px;
    width: 600px;
    position: relative;
    bottom :75px;
}
.Address{
    height: 50px;
    width: 1300px;
    position: relative;
    top: 50px;
    margin: 25px 100px;
    display:block;
}
.Address input{
    height: 50px;
    width: 1300px;
    position: relative;
}
.Delivery_Unit{
    height: 50px;
    width: 600px;
    position: relative;
    display:block;
    margin: 0px 100px;
    top:100px;
}
.Delivery_Unit select{
    height: 50px;
    width: 600px;
    position: relative;
    background: #E4002B;
    color:white;
    text-align: left;
    font-size:16px;
}
.Payment_Method{
    height: 50px;
    width: 600px;
    position: relative;
    display:block;
    margin: 0px 100px;
    top:50px;
    left:700px;
}
.Payment_Method select{
    height: 50px;
    width: 600px;
    position: relative;
    background: #E4002B;
    color:white;
    text-align: left;
    font-size:16px;
}
.Message{
    height: 50px;
    width: 600px;
    position: relative;
    top:100px;
    display:block;
    margin: 50px 100px;
}
.Message input{
    height: 50px;
    width: 600px;
    position: relative;
}

    </style>
</head>
<body>
<form th:action="@{/StateOrder} " method="post">
    <div class="Title_Box">
        <a>Xác nhận thông tin đơn hàng</a>
    </div>
    <div class="Name">
        <input name="hoTen" type="text" placeholder="Họ và tên" required>
    </div>
    <div class="Phone_Number">
        <input name="phoneNumber" type="text" placeholder="Số điện thoại" required>
    </div>
    <div class="Address">
        <input name="address" type="text" placeholder="Địa chỉ" required>
    </div>
    <div  class="Delivery_Unit">
        <select name="transport">
            <option value="Shoppe">Shoppe Food</option>
            <option value="Be Food">Be Food</option>
            <option value="Grap Food">Grab Food</option>
            <option value="0" selected="selected">Đơn vị vận chuyển</option>
        </select>
    </div>
    <div  class="Payment_Method">
        <select name="paymentMethod">
            <option value="Chuyển khoản">Chuyển khoản</option>
            <option value="Tiền mặt">Tiền mặt</option>
            <option value="Phương thức thanh toán" selected="selected">Phương thức thanh toán</option>
        </select>
    </div>
    <div  class="Message">
        <input name="note" type="text" placeholder="Lời nhắn cho tài xế" required>
    </div>
    <div class="Confirm">
        <button type="submit">xác nhận</button>
    </div>
</form>
</body>
</html>
